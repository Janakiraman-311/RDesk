on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: pkgdown

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    # Build pkgdown on Windows because the site examples and vignettes exercise
    # the native launcher tooling that is most stable on the Windows CI runner.
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Restore renv
        run: |
          r <- getOption("repos")
          if (is.null(r) || identical(r, c(CRAN = "@CRAN@"))) {
            options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))
          }
          pkgs <- c(
            "R6", "jsonlite", "digest", "processx", "callr",
            "mirai", "base64enc", "zip", "pkgdown", "knitr",
            "rmarkdown", "ggplot2", "dplyr", "mori"
          )
          install.packages(pkgs)
          missing <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
          if (length(missing) > 0) {
            stop("Failed to install required packages: ", paste(missing, collapse = ", "))
          }
        shell: Rscript {0}

      - name: Install RDesk
        # devtools is not in renv.lock; use base R CMD INSTALL instead
        # which builds and installs the package from source with no extra deps.
        run: R CMD INSTALL .
        shell: cmd

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        # Using peaceiris instead of JamesIves to avoid rsync path resolution issues on Windows
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
