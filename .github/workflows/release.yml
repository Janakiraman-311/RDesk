name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
          windows-path-include-rtools: true
          windows-path-include-mingw: true

      - name: Configure Windows Rtools
        shell: pwsh
        run: |
          $rtools = $env:RTOOLS45_HOME
          if (-not $rtools) { $rtools = 'C:\rtools45' }
          $mingw = Join-Path $rtools 'x86_64-w64-mingw32.static.posix\bin'
          $usr = Join-Path $rtools 'usr\bin'
          $compiler = Join-Path $mingw 'g++.exe'
          if (-not (Test-Path $compiler)) {
            throw "Rtools C++ compiler not found: $compiler"
          }
          $mingwUnix = $mingw -replace '\\', '/'
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $usr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BINPREF=$mingwUnix/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $compiler --version | Select-Object -First 1

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck, any::withr

      - name: Verify Rtools and Compilation
        shell: Rscript {0}
        run: |
          devtools::install(pkg = ".", upgrade = FALSE, quick = TRUE)
          launcher <- system.file("bin", "rdesk-launcher.exe", package = "RDesk")
          if (launcher == "" || !file.exists(launcher)) {
            stop("Launcher binary not found after installation!")
          }
          cat("Launcher verified at: ", launcher, "\n")

      - name: Build App Bundle
        shell: Rscript {0}
        run: |
          # Create a fresh app using the real scaffolding engine
          RDesk::rdesk_create_app("CarsDashboard", path = "C:/Temp")
          # Build the newly created app
          RDesk::build_app(app_dir = "C:/Temp/CarsDashboard", app_name = "CarsDashboard", version = "${{ github.ref_name }}")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
