name: build-app

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Configure DESCRIPTION for non-Windows installation
        if: matrix.os != 'windows-latest'
        run: |
          Rscript -e "desc <- readLines('DESCRIPTION'); desc <- desc[!grepl('^OS_type:', desc)]; writeLines(desc, 'DESCRIPTION')"

      - name: Make scripts executable
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x configure cleanup

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck, any::withr

      - name: Verify Rtools/Compiler and Install Package
        shell: Rscript {0}
        run: |
          devtools::install(pkg = ".", upgrade = FALSE, quick = TRUE)
          
          # Verify binary was built and placed in the installed package library
          binary_name <- if (.Platform$OS.type == "windows") "rdesk-launcher.exe" else "rdesk-launcher"
          launcher <- system.file("bin", binary_name, package = "RDesk")
          if (launcher == "" || !file.exists(launcher)) {
            stop("Launcher binary not found after installation!")
          }
          cat("Launcher verified at: ", launcher, "\n")

      - name: Build App
        shell: Rscript {0}
        run: |
          RDesk::build_app(
            app_dir = "inst/apps/mtcars_dashboard", 
            app_name = "CarsAnalyser", 
            out_dir = "dist",
            portable_r_method = "installer"
          )

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarsAnalyser-dist-${{ matrix.os }}
          path: dist/*
          retention-days: 30
