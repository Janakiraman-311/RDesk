name: build-app

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
          windows-path-include-rtools: true
          windows-path-include-mingw: true

      - name: Configure Windows Rtools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rtools = $env:RTOOLS45_HOME
          if (-not $rtools) { $rtools = 'C:\rtools45' }
          $mingw = Join-Path $rtools 'x86_64-w64-mingw32.static.posix\bin'
          $usr = Join-Path $rtools 'usr\bin'
          $compiler = Join-Path $mingw 'g++.exe'
          if (-not (Test-Path $compiler)) {
            throw "Rtools C++ compiler not found: $compiler"
          }
          $mingwUnix = $mingw -replace '\\', '/'
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $usr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BINPREF=$mingwUnix/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $compiler --version | Select-Object -First 1



      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck, any::withr, any::ggplot2, any::dplyr, any::broom

      - name: Verify Rtools/Compiler and Install Package
        shell: Rscript {0}
        run: |
          devtools::install(pkg = ".", upgrade = FALSE, quick = TRUE)

          # Verify binary was built and placed in the installed package library
          binary_name <- if (.Platform$OS.type == "windows") "rdesk-launcher.exe" else "rdesk-launcher"
          launcher <- system.file("bin", binary_name, package = "RDesk")
          if (launcher == "" || !file.exists(launcher)) {
            stop("Launcher binary not found after installation!")
          }
          cat("Launcher verified at: ", launcher, "\n")

      - name: Build App
        shell: Rscript {0}
        run: |
          args <- list(
            app_dir = "inst/apps/mtcars_dashboard",
            app_name = "CarsAnalyser",
            version = "1.0.0",
            out_dir = "dist"
          )
          if (.Platform$OS.type == "windows") {
            args$portable_r_method <- "installer"
          }
          do.call(RDesk::build_app, args)

      - name: Verify Windows App Output
        shell: pwsh
        run: |
          $distFiles = Get-ChildItem -Path dist
          Write-Host "Build output files:"
          $distFiles | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }
          if (-not (Test-Path "dist/CarsAnalyser-1.0.0-windows.zip")) {
            throw "Expected dist/CarsAnalyser-1.0.0-windows.zip not found!"
          }
          Write-Host "Windows package successfully generated and verified!"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarsAnalyser-dist-${{ matrix.os }}
          path: dist/*
          retention-days: 30
