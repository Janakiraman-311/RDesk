name: build-app

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'APT::Get::Fix-Missing "true";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          sudo apt-get update --fix-missing
          # libgtk-3-dev / libwebkit2gtk-4.1-dev — required to compile rdesk-launcher.
          # gcc — required to compile the Linux stub binary inside rdesk_build_linux_app().
          # xvfb / xauth / imagemagick — headless X11 display and screenshots for E2E verification.
          sudo apt-get install -y --fix-missing libgtk-3-dev libwebkit2gtk-4.1-dev gcc xvfb xauth imagemagick

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
          windows-path-include-rtools: true
          windows-path-include-mingw: true

      - name: Configure Windows Rtools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $rtools = $env:RTOOLS45_HOME
          if (-not $rtools) { $rtools = 'C:\rtools45' }
          $mingw = Join-Path $rtools 'x86_64-w64-mingw32.static.posix\bin'
          $usr = Join-Path $rtools 'usr\bin'
          $compiler = Join-Path $mingw 'g++.exe'
          if (-not (Test-Path $compiler)) {
            throw "Rtools C++ compiler not found: $compiler"
          }
          $mingwUnix = $mingw -replace '\\', '/'
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $usr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BINPREF=$mingwUnix/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $compiler --version | Select-Object -First 1

      - name: Make scripts executable
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x configure cleanup exec/rdesk.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::rcmdcheck, any::withr, any::ggplot2, any::dplyr, any::broom, any::Rapp

      - name: Verify Rtools/Compiler and Install Package
        shell: Rscript {0}
        run: |
          devtools::install(pkg = ".", upgrade = FALSE, quick = TRUE)

          # Verify binary was built and placed in the installed package library
          binary_name <- if (.Platform$OS.type == "windows") "rdesk-launcher.exe" else "rdesk-launcher"
          launcher <- system.file("bin", binary_name, package = "RDesk")
          if (launcher == "" || !file.exists(launcher)) {
            stop("Launcher binary not found after installation!")
          }
          cat("Launcher verified at: ", launcher, "\n")

      - name: Run Package Unit Tests (testthat)
        shell: Rscript {0}
        run: |
          res <- devtools::test()
          df <- as.data.frame(res)
          if (sum(df$failed) > 0) {
            stop("testthat unit tests failed.")
          }

      - name: Build App
        shell: Rscript {0}
        run: |
          args <- list(
            app_dir = "inst/apps/mtcars_dashboard",
            app_name = "CarsAnalyser",
            version = "1.0.0",
            out_dir = "dist"
          )
          if (.Platform$OS.type == "windows") {
            args$portable_r_method <- "installer"
          }
          do.call(RDesk::build_app, args)

      - name: Test Unix Rapp CLI & Scaffold Starter App
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          Rscript -e 'RDesk::install_rdesk_cli(destdir = file.path(Sys.getenv("HOME"), ".local", "bin"), overwrite = TRUE)'
          export PATH="$HOME/.local/bin:$PATH"
          command -v rdesk
          rdesk --help
          rdesk sitrep
          rdesk demo
          rm -rf /tmp/rdesk-cli-test
          mkdir -p /tmp/rdesk-cli-test
          rdesk new RDeskStarterWorkbench --path /tmp/rdesk-cli-test --theme dark
          test -f /tmp/rdesk-cli-test/RDeskStarterWorkbench/app.R
          rdesk build --app-dir /tmp/rdesk-cli-test/RDeskStarterWorkbench --dry-run

      - name: Build Additional Unix Showcase Apps (Data Studio + Starter)
        if: matrix.os != 'windows-latest'
        shell: Rscript {0}
        run: |
          RDesk::build_app(
            app_dir          = "inst/apps/data_studio",
            app_name         = "DataIntelligenceStudio",
            version          = "1.0.0",
            out_dir          = "dist",
            include_packages = c("ggplot2"),
            overwrite        = TRUE
          )
          RDesk::build_app(
            app_dir          = "/tmp/rdesk-cli-test/RDeskStarterWorkbench",
            app_name         = "RDeskStarterWorkbench",
            version          = "1.0.0",
            out_dir          = "dist",
            include_packages = c("ggplot2"),
            overwrite        = TRUE
          )

      - name: Validate macOS App Bundles, Linkage & Relocatability
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          for APP_NAME in CarsAnalyser DataIntelligenceStudio RDeskStarterWorkbench; do
            BUNDLE="dist/${APP_NAME}.app"
            echo "=== Validating ${BUNDLE} ==="
            test -f "$BUNDLE/Contents/Info.plist"                   || (echo "FAIL: Info.plist missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/Contents/PkgInfo"                      || (echo "FAIL: PkgInfo missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/Contents/MacOS/${APP_NAME}"            || (echo "FAIL: Stub missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/Contents/Resources/bin/rdesk-launcher" || (echo "FAIL: Launcher missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/Contents/Resources/app/app.R"          || (echo "FAIL: app.R missing in $APP_NAME" && exit 1)
            test -d "$BUNDLE/Contents/Resources/R-runtime/R/bin"    || (echo "FAIL: R runtime missing in $APP_NAME" && exit 1)

            test -x "$BUNDLE/Contents/MacOS/${APP_NAME}"            || (echo "FAIL: Stub not executable in $APP_NAME" && exit 1)
            test -x "$BUNDLE/Contents/Resources/bin/rdesk-launcher" || (echo "FAIL: Launcher not executable in $APP_NAME" && exit 1)

            /usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$BUNDLE/Contents/Info.plist" | grep -qx "$APP_NAME" \
              || (echo "FAIL: CFBundleExecutable misconfigured in $APP_NAME" && exit 1)

            codesign --verify --verbose "$BUNDLE/Contents/MacOS/${APP_NAME}"
            codesign --verify --verbose "$BUNDLE/Contents/Resources/bin/rdesk-launcher"
            lipo -info "$BUNDLE/Contents/MacOS/${APP_NAME}"
            lipo -info "$BUNDLE/Contents/Resources/bin/rdesk-launcher"

            echo "--- Linkage audit (${APP_NAME}) ---"
            otool -L "$BUNDLE/Contents/Resources/bin/rdesk-launcher"
            otool -L "$BUNDLE/Contents/MacOS/${APP_NAME}"
            for BIN in "$BUNDLE/Contents/Resources/bin/rdesk-launcher" "$BUNDLE/Contents/MacOS/${APP_NAME}"; do
              if otool -L "$BIN" | grep '^[[:space:]]' | grep -Eq '(/Users/|/opt/homebrew/)'; then
                echo "FAIL: Builder-local path leaked into $BIN"
                exit 1
              fi
            done
            echo "PASS: ${APP_NAME} bundle structure, permissions, plist, codesign & linkage verified."
          done

          # Stage a relocated copy of CarsAnalyser.app outside the build directory to verify true relocatability
          rm -rf /tmp/rdesk-relocated-test
          mkdir -p /tmp/rdesk-relocated-test
          cp -R dist/CarsAnalyser.app /tmp/rdesk-relocated-test/CarsAnalyser.app
          echo "Relocated CarsAnalyser.app staged at /tmp/rdesk-relocated-test/CarsAnalyser.app"

      - name: Validate Linux App Bundles, Linkage & Relocatability
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          for APP_NAME in CarsAnalyser DataIntelligenceStudio RDeskStarterWorkbench; do
            BUNDLE="dist/${APP_NAME}-1.0.0"
            echo "=== Validating ${BUNDLE} ==="
            test -f "$BUNDLE/${APP_NAME}"        || (echo "FAIL: stub binary missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/rdesk-launcher"     || (echo "FAIL: rdesk-launcher missing in $APP_NAME" && exit 1)
            test -f "$BUNDLE/app/app.R"          || (echo "FAIL: app/app.R missing in $APP_NAME" && exit 1)
            test -d "$BUNDLE/R-runtime/R/bin"    || (echo "FAIL: R-runtime/R/bin missing in $APP_NAME" && exit 1)

            test -x "$BUNDLE/${APP_NAME}"        || (echo "FAIL: stub not executable in $APP_NAME" && exit 1)
            test -x "$BUNDLE/rdesk-launcher"     || (echo "FAIL: rdesk-launcher not executable in $APP_NAME" && exit 1)

            MISSING_LIBS=$(ldd "$BUNDLE/rdesk-launcher" | grep -c "not found" || true)
            echo "Missing shared libs in $APP_NAME launcher: $MISSING_LIBS"
            test "$MISSING_LIBS" -eq 0
          done

          rm -rf /tmp/rdesk-relocated-test
          mkdir -p /tmp/rdesk-relocated-test
          cp -r dist/CarsAnalyser-1.0.0 /tmp/rdesk-relocated-test/CarsAnalyser-1.0.0
          echo "Relocated CarsAnalyser-1.0.0 staged at /tmp/rdesk-relocated-test/CarsAnalyser-1.0.0"

      - name: Full macOS GUI + WKWebView + IPC + Data-Hydration + Screenshot E2E Suite
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          OUT_DIR="$PWD/dist/macos-e2e"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          SUMMARY="$OUT_DIR/SUMMARY.md"
          cat << 'EOF' > "$SUMMARY"
          # macOS Full Visual & IPC E2E Test Report

          | App | Launch Path | Bundle Size | IPC Handshake | Data & Post-Load IPC | Latency | URL | Desktop Screenshot | Window Screenshot |
          |---|---|---|---|---|---|---|---|---|
          EOF

          find_launcher_window_id() {
            swift -e '
              import CoreGraphics
              import Foundation
              if let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] {
                for w in list {
                  let owner = (w[kCGWindowOwnerName as String] as? String) ?? ""
                  let bounds = (w[kCGWindowBounds as String] as? [String: Any]) ?? [:]
                  let width = (bounds["Width"] as? Double) ?? 0
                  let height = (bounds["Height"] as? Double) ?? 0
                  if owner.lowercased().contains("rdesk") && width >= 200 && height >= 200 {
                    if let wid = w[kCGWindowNumber as String] as? Int {
                      print(wid)
                      exit(0)
                    }
                  }
                }
              }
            ' 2>/dev/null || true
          }

          screenshot_info() {
            local file="$1"
            if [ ! -f "$file" ]; then
              echo "n/a"
              return
            fi
            local bytes w h
            bytes=$(stat -f%z "$file")
            w=$(sips -g pixelWidth "$file" 2>/dev/null | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "$file" 2>/dev/null | awk '/pixelHeight/{print $2}')
            echo "${w:-?}x${h:-?} ($((bytes / 1024)) KB)"
          }

          FAILURES=0

          run_macos_e2e_app() {
            local APP_NAME="$1"
            local BUNDLE_PATH="$2"
            local SLUG="$3"
            local LAUNCH_NOTE="$4"
            local REQUIRE_DATA="${5:-0}"

            echo "=================================================================="
            echo "=== E2E Test: ${APP_NAME} (${BUNDLE_PATH}) ==="
            echo "=================================================================="

            local SENTINEL="$OUT_DIR/${SLUG}-ipc.json"
            local DATA_SENTINEL="$OUT_DIR/${SLUG}-data.json"
            local DESKTOP_PNG="$OUT_DIR/${SLUG}-desktop.png"
            local WINDOW_PNG="$OUT_DIR/${SLUG}-window.png"
            local LOG_FILE="$OUT_DIR/${SLUG}-launch.log"
            local BUNDLE_SIZE
            BUNDLE_SIZE=$(du -sh "$BUNDLE_PATH" | awk '{print $1}')

            rm -f "$SENTINEL" "$DATA_SENTINEL" "$DESKTOP_PNG" "$WINDOW_PNG" "$LOG_FILE"

            if [ "$REQUIRE_DATA" -eq 1 ]; then
              RDESK_SMOKE_TEST=1 RDESK_SMOKE_SENTINEL="$SENTINEL" RDESK_SMOKE_DATA_SENTINEL="$DATA_SENTINEL" RDESK_DEBUG=1 \
                "${BUNDLE_PATH}/Contents/MacOS/${APP_NAME}" >"$LOG_FILE" 2>&1 &
            else
              RDESK_SMOKE_TEST=1 RDESK_SMOKE_SENTINEL="$SENTINEL" RDESK_DEBUG=1 \
                "${BUNDLE_PATH}/Contents/MacOS/${APP_NAME}" >"$LOG_FILE" 2>&1 &
            fi
            local PID=$!

            local ELAPSED=0
            local IPC_OK=0
            for i in $(seq 1 45); do
              if [ -f "$SENTINEL" ]; then
                ELAPSED=$i
                IPC_OK=1
                echo "IPC handshake sentinel detected after ${i}s:"
                cat "$SENTINEL"
                break
              fi
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "App process exited early before IPC sentinel was written (after ${i}s)"
                cat "$LOG_FILE" || true
                break
              fi
              sleep 1
            done

            local DATA_STATUS="n/a"
            local DATA_OK=0
            if [ "$REQUIRE_DATA" -eq 1 ]; then
              for j in $(seq 1 35); do
                if [ -f "$DATA_SENTINEL" ]; then
                  DATA_OK=1
                  echo "Data hydration + post-load IPC sentinel detected (+${j}s):"
                  cat "$DATA_SENTINEL"
                  break
                fi
                if ! kill -0 "$PID" 2>/dev/null; then
                  echo "App exited before data sentinel was written (+${j}s)"
                  break
                fi
                sleep 1
              done
            else
              sleep 4
            fi

            screencapture -x "$DESKTOP_PNG" || echo "Warning: desktop screencapture returned non-zero"
            if [ -f "$DESKTOP_PNG" ]; then
              echo "Captured desktop screenshot: $(screenshot_info "$DESKTOP_PNG")"
            fi

            local WIN_ID
            WIN_ID=$(find_launcher_window_id | head -n 1 | tr -d '[:space:]')
            if [ -n "$WIN_ID" ]; then
              echo "Detected rdesk-launcher CGWindowID: $WIN_ID"
              screencapture -x -l "$WIN_ID" -o "$WINDOW_PNG" || echo "Warning: window screencapture returned non-zero"
              if [ -f "$WINDOW_PNG" ]; then
                echo "Captured window screenshot: $(screenshot_info "$WINDOW_PNG")"
              fi
            else
              echo "No focused CGWindowID returned (using desktop screenshot)"
            fi

            local SENTINEL_URL="n/a"
            local IPC_STATUS="FAIL"
            local APP_FAILED=0

            if [ ! -f "$DESKTOP_PNG" ] || [ "$(stat -f%z "$DESKTOP_PNG")" -lt 5000 ]; then
              echo "FAIL: Desktop screenshot missing or suspiciously small for ${APP_NAME}"
              APP_FAILED=1
            fi

            if [ "$IPC_OK" -eq 1 ]; then
              if SENTINEL_URL=$(Rscript -e "j <- jsonlite::fromJSON('$SENTINEL'); stopifnot(identical(j\$status, 'BRIDGE_READY'), identical(j\$platform, 'Darwin')); cat(if (!is.null(j\$page_url)) j\$page_url else '')"); then
                IPC_STATUS="PASS"
              else
                IPC_STATUS="BAD SENTINEL"
                APP_FAILED=1
              fi
            elif kill -0 "$PID" 2>/dev/null; then
              IPC_STATUS="ALIVE (no sentinel)"
              APP_FAILED=1
            else
              IPC_STATUS="EXITED EARLY"
              APP_FAILED=1
            fi

            if [ "$REQUIRE_DATA" -eq 1 ]; then
              if [ "$DATA_OK" -eq 1 ]; then
                if DATA_STATUS=$(Rscript -e "
                  d <- jsonlite::fromJSON('$DATA_SENTINEL')
                  stopifnot(
                    identical(d\$status, 'DATA_AND_POST_LOAD_IPC_OK'),
                    identical(d\$platform, 'Darwin'),
                    isTRUE(d\$post_load_pong),
                    as.integer(d\$kpi_count) >= 6L,
                    as.integer(d\$table1_rows) >= 15L,
                    isTRUE(d\$has_overview_chart),
                    isTRUE(d\$has_dist_chart),
                    isTRUE(d\$has_corr_chart),
                    isTRUE(d\$has_outlier_chart)
                  )
                  cat(sprintf('PASS (%d KPIs, %d Table1 rows, 4 charts, %s)', d\$kpi_count, d\$table1_rows, d\$primary_metric))
                "); then
                  echo "Data hydration check: $DATA_STATUS"
                else
                  DATA_STATUS="BAD DATA SENTINEL"
                  APP_FAILED=1
                fi
              else
                DATA_STATUS="FAIL (no data sentinel)"
                APP_FAILED=1
              fi
            fi

            local DESK_INFO WIN_INFO
            DESK_INFO=$(screenshot_info "$DESKTOP_PNG")
            WIN_INFO=$(screenshot_info "$WINDOW_PNG")
            echo "| \`${APP_NAME}\` | ${LAUNCH_NOTE} | ${BUNDLE_SIZE} | **${IPC_STATUS}** | ${DATA_STATUS} | ${ELAPSED}s | \`${SENTINEL_URL}\` | ${DESK_INFO} | ${WIN_INFO} |" >> "$SUMMARY"

            kill "$PID" 2>/dev/null || true
            pkill -x "rdesk-launcher" 2>/dev/null || true
            sleep 1

            echo "--- Launch log (${APP_NAME}) ---"
            cat "$LOG_FILE" || true

            if [ "$APP_FAILED" -ne 0 ]; then
              FAILURES=$((FAILURES + 1))
              echo "" >> "$SUMMARY"
              echo "### Failure Log: \`${APP_NAME}\`" >> "$SUMMARY"
              echo '```text' >> "$SUMMARY"
              tail -n 60 "$LOG_FILE" >> "$SUMMARY" 2>/dev/null || true
              echo '```' >> "$SUMMARY"
            fi
          }

          run_macos_e2e_app "CarsAnalyser" "/tmp/rdesk-relocated-test/CarsAnalyser.app" "cars" "Relocated (\`/tmp/...\`)" 0
          run_macos_e2e_app "DataIntelligenceStudio" "$PWD/dist/DataIntelligenceStudio.app" "studio" "Built (\`dist/\`)" 1
          run_macos_e2e_app "RDeskStarterWorkbench" "$PWD/dist/RDeskStarterWorkbench.app" "starter" "CLI-scaffolded (\`rdesk new\`)" 0

          if [ -f "$OUT_DIR/cars-desktop.png" ]; then
            cp "$OUT_DIR/cars-desktop.png" "$PWD/dist/macos-smoke-screenshot.png"
          fi
          if [ -f "$OUT_DIR/cars-ipc.json" ]; then
            cp "$OUT_DIR/cars-ipc.json" "$PWD/dist/macos-smoke-ipc.json"
          fi

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY"

          if [ "$FAILURES" -ne 0 ]; then
            echo "FAIL: ${FAILURES} macOS E2E app test(s) failed."
            exit 1
          fi

      - name: Full Linux GUI + WebKitGTK + IPC + Data-Hydration + Screenshot E2E Suite
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          OUT_DIR="$PWD/dist/linux-e2e"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          SUMMARY="$OUT_DIR/SUMMARY.md"
          cat << 'EOF' > "$SUMMARY"
          # Linux Full Visual & IPC E2E Test Report

          | App | Launch Path | Bundle Size | IPC Handshake | Data & Post-Load IPC | Latency | URL | Screenshot |
          |---|---|---|---|---|---|---|---|
          EOF

          Xvfb :99 -screen 0 1280x860x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          export DISPLAY=:99
          sleep 1

          FAILURES=0

          run_linux_e2e_app() {
            local APP_NAME="$1"
            local BUNDLE_PATH="$2"
            local SLUG="$3"
            local LAUNCH_NOTE="$4"
            local REQUIRE_DATA="${5:-0}"

            echo "=================================================================="
            echo "=== Linux E2E Test: ${APP_NAME} (${BUNDLE_PATH}) ==="
            echo "=================================================================="

            local SENTINEL="$OUT_DIR/${SLUG}-ipc.json"
            local DATA_SENTINEL="$OUT_DIR/${SLUG}-data.json"
            local DESKTOP_PNG="$OUT_DIR/${SLUG}-desktop.png"
            local LOG_FILE="$OUT_DIR/${SLUG}-launch.log"
            local BUNDLE_SIZE
            BUNDLE_SIZE=$(du -sh "$BUNDLE_PATH" | awk '{print $1}')

            rm -f "$SENTINEL" "$DATA_SENTINEL" "$DESKTOP_PNG" "$LOG_FILE"

            if [ "$REQUIRE_DATA" -eq 1 ]; then
              RDESK_SMOKE_TEST=1 RDESK_SMOKE_SENTINEL="$SENTINEL" RDESK_SMOKE_DATA_SENTINEL="$DATA_SENTINEL" RDESK_DEBUG=1 \
                "${BUNDLE_PATH}/${APP_NAME}" >"$LOG_FILE" 2>&1 &
            else
              RDESK_SMOKE_TEST=1 RDESK_SMOKE_SENTINEL="$SENTINEL" RDESK_DEBUG=1 \
                "${BUNDLE_PATH}/${APP_NAME}" >"$LOG_FILE" 2>&1 &
            fi
            local PID=$!

            local ELAPSED=0
            local IPC_OK=0
            for i in $(seq 1 35); do
              if [ -f "$SENTINEL" ]; then
                ELAPSED=$i
                IPC_OK=1
                echo "IPC handshake sentinel detected after ${i}s:"
                cat "$SENTINEL"
                break
              fi
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "App process exited early before IPC sentinel was written (after ${i}s)"
                cat "$LOG_FILE" || true
                break
              fi
              sleep 1
            done

            local DATA_STATUS="n/a"
            local DATA_OK=0
            if [ "$REQUIRE_DATA" -eq 1 ]; then
              for j in $(seq 1 35); do
                if [ -f "$DATA_SENTINEL" ]; then
                  DATA_OK=1
                  echo "Data hydration + post-load IPC sentinel detected (+${j}s):"
                  cat "$DATA_SENTINEL"
                  break
                fi
                if ! kill -0 "$PID" 2>/dev/null; then
                  echo "App exited before data sentinel was written (+${j}s)"
                  break
                fi
                sleep 1
              done
            else
              sleep 4
            fi

            import -window root "$DESKTOP_PNG" || echo "Warning: Xvfb import screenshot failed"
            local SHOT_INFO="n/a"
            if [ -f "$DESKTOP_PNG" ]; then
              local bytes
              bytes=$(stat -c%s "$DESKTOP_PNG")
              SHOT_INFO="$((bytes / 1024)) KB"
            fi

            local SENTINEL_URL="n/a"
            local IPC_STATUS="FAIL"
            local APP_FAILED=0

            if [ ! -f "$DESKTOP_PNG" ] || [ "$(stat -c%s "$DESKTOP_PNG")" -lt 2000 ]; then
              echo "FAIL: Xvfb screenshot missing or suspiciously small for ${APP_NAME}"
              APP_FAILED=1
            fi

            if [ "$IPC_OK" -eq 1 ]; then
              if SENTINEL_URL=$(Rscript -e "j <- jsonlite::fromJSON('$SENTINEL'); stopifnot(identical(j\$status, 'BRIDGE_READY'), identical(j\$platform, 'Linux')); cat(if (!is.null(j\$page_url)) j\$page_url else '')"); then
                IPC_STATUS="PASS"
              else
                IPC_STATUS="BAD SENTINEL"
                APP_FAILED=1
              fi
            elif kill -0 "$PID" 2>/dev/null; then
              IPC_STATUS="ALIVE (no sentinel)"
              APP_FAILED=1
            else
              IPC_STATUS="EXITED EARLY"
              APP_FAILED=1
            fi

            if [ "$REQUIRE_DATA" -eq 1 ]; then
              if [ "$DATA_OK" -eq 1 ]; then
                if DATA_STATUS=$(Rscript -e "
                  d <- jsonlite::fromJSON('$DATA_SENTINEL')
                  stopifnot(
                    identical(d\$status, 'DATA_AND_POST_LOAD_IPC_OK'),
                    identical(d\$platform, 'Linux'),
                    isTRUE(d\$post_load_pong),
                    as.integer(d\$kpi_count) >= 6L,
                    as.integer(d\$table1_rows) >= 15L,
                    isTRUE(d\$has_overview_chart),
                    isTRUE(d\$has_dist_chart),
                    isTRUE(d\$has_corr_chart),
                    isTRUE(d\$has_outlier_chart)
                  )
                  cat(sprintf('PASS (%d KPIs, %d Table1 rows, 4 charts, %s)', d\$kpi_count, d\$table1_rows, d\$primary_metric))
                "); then
                  echo "Data hydration check: $DATA_STATUS"
                else
                  DATA_STATUS="BAD DATA SENTINEL"
                  APP_FAILED=1
                fi
              else
                DATA_STATUS="FAIL (no data sentinel)"
                APP_FAILED=1
              fi
            fi

            echo "| \`${APP_NAME}\` | ${LAUNCH_NOTE} | ${BUNDLE_SIZE} | **${IPC_STATUS}** | ${DATA_STATUS} | ${ELAPSED}s | \`${SENTINEL_URL}\` | ${SHOT_INFO} |" >> "$SUMMARY"

            kill "$PID" 2>/dev/null || true
            pkill -x "rdesk-launcher" 2>/dev/null || true
            sleep 1

            echo "--- Launch log (${APP_NAME}) ---"
            cat "$LOG_FILE" || true

            if [ "$APP_FAILED" -ne 0 ]; then
              FAILURES=$((FAILURES + 1))
              echo "" >> "$SUMMARY"
              echo "### Failure Log: \`${APP_NAME}\`" >> "$SUMMARY"
              echo '```text' >> "$SUMMARY"
              tail -n 60 "$LOG_FILE" >> "$SUMMARY" 2>/dev/null || true
              echo '```' >> "$SUMMARY"
            fi
          }

          run_linux_e2e_app "CarsAnalyser" "/tmp/rdesk-relocated-test/CarsAnalyser-1.0.0" "cars" "Relocated (\`/tmp/...\`)" 0
          run_linux_e2e_app "DataIntelligenceStudio" "$PWD/dist/DataIntelligenceStudio-1.0.0" "studio" "Built (\`dist/\`)" 1
          run_linux_e2e_app "RDeskStarterWorkbench" "$PWD/dist/RDeskStarterWorkbench-1.0.0" "starter" "CLI-scaffolded (\`rdesk new\`)" 0

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY"

          if [ "$FAILURES" -ne 0 ]; then
            echo "FAIL: ${FAILURES} Linux E2E app test(s) failed."
            exit 1
          fi

      - name: Upload macOS Visual E2E Report & Screenshots
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-visual-e2e-screenshots
          path: dist/macos-e2e/*
          retention-days: 30

      - name: Upload Linux Visual E2E Report & Screenshots
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-e2e-screenshots
          path: dist/linux-e2e/*
          retention-days: 30

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarsAnalyser-dist-${{ matrix.os }}
          path: dist/*
          retention-days: 30
