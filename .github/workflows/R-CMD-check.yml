name: R-CMD-check

on:
  push:
    branches: [ main, dev, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""
      # Disable CRAN incoming checks - submission-time only.
      # Without these the CI fails with 'Insufficient package version'
      # once 1.0.5 is already live on CRAN.
      _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
      _R_CHECK_CRAN_INCOMING_: "FALSE"
      _R_CHECK_FORCE_SUGGESTS_: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true



      - name: Make scripts executable
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x configure cleanup

      - uses: r-lib/actions/setup-pandoc@v2

      # ── Install check dependencies directly (no renv restore in CI) ────────
      # renv::restore() is skipped because:
      #   1. renv.lock tracks dev packages (devtools, pkgdown, etc.) that
      #      are large and slow to install for a check-only job.
      #   2. The renv library path is for the developer's machine; CI
      #      installs fresh from RSPM every run (cached below).
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install package dependencies
        run: |
          r <- getOption("repos")
          if (is.null(r) || identical(r, c(CRAN = "@CRAN@"))) {
            options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))
          }
          pkgs <- c(
            "R6", "jsonlite", "digest", "processx", "callr",
            "mirai", "base64enc", "zip", "knitr", "rmarkdown",
            "rcmdcheck", "withr", "ggplot2"
          )
          installed <- rownames(installed.packages())
          to_install <- setdiff(pkgs, installed)
          if (length(to_install) > 0) {
            install.packages(to_install)
          }
          missing <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
          if (length(missing) > 0) {
            stop("Failed to install required packages: ", paste(missing, collapse = ", "))
          }
        shell: Rscript {0}

      - name: Run R-CMD-check
        run: |
          res <- rcmdcheck::rcmdcheck(
            args      = c("--no-manual", "--as-cran"),
            error_on  = "error",
            check_dir = "check"
          )
          if (length(res$errors) > 0) {
            cat(paste(res$errors, collapse = "\n"))
            stop("R CMD check failed with errors")
          }
          # Print any notes so they are visible in the log.
          # For a submission candidate we want clear visibility into
          # platform-specific notes rather than silently assuming one.
          if (length(res$notes) > 0) {
            cat("Notes:\n")
            cat(paste(res$notes, collapse = "\n"))
          }
          if (length(res$warnings) > 0) {
            cat("Warnings:\n")
            cat(paste(res$warnings, collapse = "\n"))
          }
        shell: Rscript {0}

      - name: Verify macOS Universal Binaries
        if: matrix.os == 'macos-latest'
        run: |
          R CMD INSTALL .
          # Query the installed package binary directory
          INST_BIN=$(Rscript -e "cat(system.file('bin', package = 'RDesk'))")
          echo "Installed binary directory: $INST_BIN"
          
          # Test 1 — Binary integrity
          echo "=== Testing Binary Integrity ==="
          lipo -info "$INST_BIN/rdesk-launcher"
          lipo -info "$INST_BIN/rdesk-stub-macos"
          file "$INST_BIN/rdesk-launcher"
          file "$INST_BIN/rdesk-stub-macos"
          codesign --verify --verbose "$INST_BIN/rdesk-launcher"
          codesign --verify --verbose "$INST_BIN/rdesk-stub-macos"
          
          # Test 2 — Dynamic library linkage (verify no absolute builder paths leak)
          echo "=== Testing Linkage Integrity ==="
          otool -L "$INST_BIN/rdesk-launcher"
          # Only check indented library link lines to avoid false positives on the binary path itself
          if otool -L "$INST_BIN/rdesk-launcher" | grep '^[[:space:]]' | grep -q "/Users/"; then
            echo "ERROR: Absolute builder path found in binary!"
            exit 1
          fi

      - name: Test RDesk IPC protocol headlessly
        if: matrix.os == 'macos-latest'
        run: |
          cat << 'EOF' > /tmp/test_ipc.R
          # Load RDesk in CI mode — no window, no launcher
          options(rdesk.ci_mode = TRUE)
          library(RDesk)

          # Test message construction
          msg <- rdesk_message("get_data", list(filter = "cyl == 6"))
          stopifnot(msg$type      == "get_data")
          stopifnot(msg$version   == "1.0")
          stopifnot(!is.null(msg$id))
          stopifnot(!is.null(msg$timestamp))
          cat("IPC message construction: PASS\n")

          # Test message parsing
          raw <- jsonlite::toJSON(msg, auto_unbox = TRUE)
          parsed <- rdesk_parse_message(raw)
          stopifnot(parsed$type == "get_data")
          cat("IPC message parsing: PASS\n")

          # Test data conversion helpers
          result <- rdesk_df_to_list(head(mtcars, 3))
          stopifnot(length(result$rows) == 3)
          stopifnot("mpg" %in% result$cols)
          cat("Data conversion: PASS\n")

          # Test plot helper (no display needed — writes to file)
          p <- ggplot2::ggplot(mtcars, ggplot2::aes(wt, mpg)) +
               ggplot2::geom_point()
          b64 <- rdesk_plot_to_base64(p)
          stopifnot(nchar(b64) > 1000)
          cat("Plot to base64: PASS\n")

          # Test storage system
          withr::with_tempdir({
            prefs <- rdesk_storage("TestApp", "local")
            prefs$set("test_key", "test_value")
            stopifnot(prefs$get("test_key") == "test_value")
            prefs$remove("test_key")
            stopifnot(is.null(prefs$get("test_key")))
            cat("Storage system: PASS\n")
          })

          cat("All IPC tests: PASS\n")
          EOF

          Rscript /tmp/test_ipc.R

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
