name: R-CMD-check

on:
  push:
    branches: [ main, "*" ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    runs-on: windows-latest
    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: false
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""
      # Disable CRAN incoming checks in CI — these are submission-time
      # checks only. Without these, the CI fails with 'Insufficient
      # package version' once the package is already published on CRAN.
      _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
      _R_CHECK_CRAN_INCOMING_: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: renv/library
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore renv environment
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          renv::restore(prompt = FALSE, clean = FALSE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::withr

      - name: Run R-CMD-check
        run: |
          if (!requireNamespace("rcmdcheck", quietly = TRUE)) install.packages("rcmdcheck")
          res <- rcmdcheck::rcmdcheck(
            args      = c("--no-manual", "--as-cran"),
            error_on  = "error",   # warnings suppressed: CRAN incoming checks disabled via env
            check_dir = "check"
          )
          if (length(res$errors) > 0) stop("R CMD check failed with errors")
          # Expected notes: 1 (-mwindows, pre-approved). Warn if extra notes appear.
          n_notes <- length(res$notes)
          if (n_notes > 1) {
            message("Note: ", n_notes, " notes found (expected 1 for -mwindows). Review check/")
          }
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
