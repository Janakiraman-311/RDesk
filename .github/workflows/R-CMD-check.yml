name: R-CMD-check

on:
  push:
    branches: [ main, dev, "**" ]
  pull_request:
name: R-CMD-check

on:
  push:
    branches: [ main, dev, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RENV_PATHS_LIBRARY: renv/library
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      RENV_CONFIG_SNAPSHOT_TYPE: explicit
      RENV_CONFIG_BIOCONDUCTOR_VERSION: ""
      # Keep incoming checks disabled in ordinary CI; the release preflight
      # must run separately with CRAN incoming checks enabled.
      _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
      _R_CHECK_CRAN_INCOMING_: "FALSE"
      _R_CHECK_FORCE_SUGGESTS_: "TRUE"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
          windows-path-include-rtools: true
          windows-path-include-mingw: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Configure Windows Rtools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rtools = $env:RTOOLS45_HOME
          if (-not $rtools) { $rtools = 'C:\rtools45' }
          $mingw = Join-Path $rtools 'x86_64-w64-mingw32.static.posix\bin'
          $usr = Join-Path $rtools 'usr\bin'
          if (-not (Test-Path (Join-Path $mingw 'g++.exe'))) {
            throw "Rtools C++ compiler not found: $mingw"
          }
          $mingwUnix = $mingw -replace '\\', '/'
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $usr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BINPREF=$mingwUnix/" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $mingw 'g++.exe') --version | Select-Object -First 1

      # ── Install check dependencies directly (no renv restore in CI) ────────
      # renv::restore() is skipped because:
      #   1. renv.lock tracks dev packages (devtools, pkgdown, etc.) that
      #      are large and slow to install for a check-only job.
      #   2. The renv library path is for the developer's machine; CI
      #      installs fresh from RSPM every run (cached below).
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-pkgs-${{ runner.os }}-

      - name: Install package dependencies
        run: |
          r <- getOption("repos")
          if (is.null(r) || identical(r, c(CRAN = "@CRAN@"))) {
            options(repos = c(CRAN = "https://packagemanager.posit.co/cran/latest"))
          }
          pkgs <- c(
            "R6", "jsonlite", "digest", "processx", "callr",
            "mirai", "base64enc", "zip", "testthat", "withr",
            "knitr", "rmarkdown", "ggplot2", "dplyr", "broom", "devtools",
            "rstudioapi",
            "renv", "rcmdcheck"
          )
          installed <- rownames(installed.packages())
          to_install <- setdiff(pkgs, installed)
          if (length(to_install) > 0) {
            install.packages(to_install)
          }
          missing <- pkgs[!sapply(pkgs, requireNamespace, quietly = TRUE)]
          if (length(missing) > 0) {
            stop("Failed to install required packages: ", paste(missing, collapse = ", "))
          }
        shell: Rscript {0}

      - name: Run R-CMD-check
        run: |
          res <- rcmdcheck::rcmdcheck(
            args      = c("--no-manual", "--as-cran"),
            error_on  = "warning",
            check_dir = "check"
          )
          if (length(res$errors) > 0) {
            cat(paste(res$errors, collapse = "\n"))
            stop("R CMD check failed with errors")
          }
          # Print any notes so they are visible in the log.
          # For a submission candidate we want clear visibility into
          # platform-specific notes rather than silently assuming one.
          if (length(res$notes) > 0) {
            cat("Notes:\n")
            cat(paste(res$notes, collapse = "\n"))
          }
          if (length(res$warnings) > 0) {
            cat("Warnings:\n")
            cat(paste(res$warnings, collapse = "\n"))
          }
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
