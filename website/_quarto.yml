project:
  type: website
  output-dir: _site

website:
  title: "RDesk"
  description: "Native Desktop Applications for R with Zero Network Ports"
  site-url: "https://janakiraman-311.github.io/RDesk/"
  repo-url: "https://github.com/Janakiraman-311/RDesk"
  repo-actions: [issue]
  search:
    location: sidebar
    type: textbox
  navbar:
    background: primary
    left:
      - text: "Get Started"
        href: getting-started.qmd
      - text: "Architecture"
        href: architecture.qmd
      - text: "Async"
        href: async-guide.qmd
      - text: "Shiny Migration"
        href: shiny-migration.qmd
      - text: "Distribution"
        href: bundling-distribution.qmd
      - text: "API"
        href: api-reference.qmd
    right:
      - text: "pkgdown Reference"
        href: https://janakiraman-311.github.io/RDesk/pkgdown/reference/index.html
      - icon: github
        href: https://github.com/Janakiraman-311/RDesk
        aria-label: GitHub
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Guides"
        contents:
          - getting-started.qmd
          - shiny-migration.qmd
          - async-guide.qmd
      - section: "Architecture & Core"
        contents:
          - architecture.qmd
          - multi-user-storage.qmd
          - bundling-distribution.qmd
      - section: "Reference"
        contents:
          - api-reference.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-tools: true
    code-block-border-left: true
    highlight-style: github
